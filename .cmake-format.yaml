format:
  line_width: 120
  tab_size: 4
  use_tabchars: false
  max_subgroups_hwrap: 3
  max_pargs_hwrap: 6
  dangle_parens: true
  dangle_align: prefix
  command_case: canonical
  keyword_case: upper
  separate_ctrl_name_with_space: false
  separate_fn_name_with_space: false
  line_ending: unix
markup:
  enable_markup: false
